[pytest]
testpaths = tests
# The page tests start a backend on the tests' database and a frontend dev server: `pytest -m page`
addopts = -m "not page" -ra
markers =
    page: renders the report from the fixture in a real frontend (starts uvicorn and next dev; a minute or two)
# A test marked as expected to fail that passes fails the run, until its mark is taken off
xfail_strict = true
